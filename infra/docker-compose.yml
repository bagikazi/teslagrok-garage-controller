services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: garage
      POSTGRES_PASSWORD: change-me-local-only
      POSTGRES_DB: garage
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U garage -d garage"]
      interval: 5s
      timeout: 5s
      retries: 10
    expose: ["5432"]

  mosquitto:
    image: eclipse-mosquitto:2.0
    volumes:
      - ./mosquitto/mosquitto.dev.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    ports:
      - "1883:1883"
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/broker/version' -C 1 -W 3 >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: server/api/Dockerfile
    environment:
      NODE_ENV: development
      API_PORT: 4000
      DATABASE_URL: postgres://garage:change-me-local-only@postgres:5432/garage
      MQTT_URL: mqtt://mosquitto:1883
      JWT_SECRET: local-development-secret-change-before-production-123456
      CAMERA_UPLOAD_TOKEN: local-camera-token-change-before-production
    depends_on:
      postgres: { condition: service_healthy }
      mosquitto: { condition: service_healthy }
    ports:
      - "4000:4000"
      - "20000:20000"

  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
      NEXT_PUBLIC_WS_URL: ws://localhost:4000/ws
    depends_on: [api]
    ports:
      - "3000:3000"

volumes:
  postgres-data:
  mosquitto-data:
